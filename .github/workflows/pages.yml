name: Validate Python Training Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML files exist
        run: |
          echo "✓ Checking for required files..."
          test -f index.html && echo "✓ index.html found"
          test -f styles.css && echo "✓ styles.css found"
          test -f script.js && echo "✓ script.js found"
          test -f README.md && echo "✓ README.md found"
          echo "✓ All files validated successfully!"

      - name: Check file sizes
        run: |
          echo "File sizes:"
          ls -lh index.html styles.css script.js
          echo "✓ Site is ready for GitHub Pages deployment"
